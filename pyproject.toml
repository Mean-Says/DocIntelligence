[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[project]
name = "docintelligence"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    # API
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-multipart>=0.0.12",
    # DB
    "sqlmodel>=0.0.22",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    # Queue
    "redis>=5.2.0",
    "arq>=0.26.1",
    # AI
    "anthropic>=0.40.0",
    "groq>=0.13.0",
    # PDF / OCR
    "pdfplumber>=0.11.0",
    "pytesseract>=0.3.13",
    "pillow>=11.0.0",
    "pymupdf>=1.25.0",
    # Storage
    "boto3>=1.35.0",
    # Config
    "pydantic-settings>=2.6.0",
    # Alembic migrations síncronas
    "psycopg2-binary>=2.9.0",
    # Auth
    "bcrypt>=4.2.0",
    "python-jose[cryptography]>=3.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "anyio>=4.0.0",
    "httpx>=0.28.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.8.0",
    "aiosqlite>=0.20.0",
    "fakeredis[aioredis]>=2.26.0",  # Redis em memória para dev/testes
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
